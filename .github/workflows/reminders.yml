name: Check task reminders

on:
  schedule:
    # Runs every 5 minutes. GitHub may delay this slightly under load —
    # that's the tradeoff for a free scheduler.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Run reminder check
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-reminders.js
